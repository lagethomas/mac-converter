<!DOCTYPE html>
<html>
<head>
    <title>Conversor de MAC</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            width: auto;
            padding: 15px;
            background-color: #ffffff;
            border-radius: 5px;
            position: relative;
            overflow-y: auto; /* Para garantir que o scroll apareça se necessário */
            height: auto;
        }
        h2 {
            font-size: 18px;
            color: #333;
            text-align: center;
            margin-bottom: 15px;
            margin-top: 5px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 13px;
        }
        input[type="text"] {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            width: calc(100% - 22px);
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-section h3 {
            font-size: 15px;
            color: #444;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .result-item {
            background-color: #e9e9e9;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #333;
            word-break: break-all;
			height:15px;
            cursor: pointer; /* Adiciona um cursor de ponteiro para indicar que é clicável */
            transition: background-color 0.2s ease; /* Transição suave para o hover */
        }
        .result-item:hover {
            background-color: #dcdcdc; /* Cor de fundo ao passar o mouse */
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: center;
        }
        #copyMessage {
            position: fixed; /* Fixa a mensagem na tela */
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%); /* Centraliza horizontalmente */
            background-color: #28a745; /* Cor verde para sucesso */
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            font-size: 13px;
            opacity: 0; /* Começa invisível */
            transition: opacity 0.3s ease-in-out; /* Transição suave */
            z-index: 100; /* Garante que fique acima de outros elementos */
            white-space: nowrap; /* Evita que o texto quebre linha */
        }
        #copyMessage.show {
            opacity: 1; /* Torna visível */
        }
    </style>
</head>
<body>
    <h2>Conversor de MAC Address</h2>

    <label for="macInput">Informe o MAC Address:</label>
    <input type="text" id="macInput" placeholder="Ex: 00-05-16-59-94-C9">
    <div id="macError" class="error-message"></div>

    <button id="generateBtn">Gerar Variações</button>

    <div id="results">
        <h3>Variações Comuns:</h3>
        <div class="result-item" id="formatDashHyphen"></div>
        <div class="result-item" id="formatColon"></div>
        <div class="result-item" id="formatDot"></div>
        <div class="result-item" id="formatNoSeparator"></div>
        <div class="result-item" id="formatSpaces"></div>
        <div class="result-item" id="formatHP"></div>
        <div class="result-item" id="formatFourByFour"></div> </div>

    <div id="copyMessage">Copiado!</div>

    <script src="scripts/popup.js"></script>
</body>
</html>
